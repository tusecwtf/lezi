services:
  lezi-sync:
    image: ${LEZI_SYNC_IMAGE:-lezi-sync:0.2.2}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LEZI_SYNC_VERSION: ${LEZI_SYNC_VERSION:-0.2.2}
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    ports:
      - "${LEZI_SYNC_PORT:-8765}:8765"
    environment:
      LEZI_DATA_DIR: /data
      LEZI_HOST: "0.0.0.0"
      LEZI_PORT: "8765"
      LEZI_INVITE_TTL_HOURS: ${LEZI_INVITE_TTL_HOURS:-24}
      LEZI_MAX_MEDIA_BYTES: ${LEZI_MAX_MEDIA_BYTES:-10485760}
    volumes:
      - ${LEZI_DATA_HOST_PATH:-./data}:/data
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "lezi-sync", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
