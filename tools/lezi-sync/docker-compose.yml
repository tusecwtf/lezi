# Default: non-root (uid 10001) + persistent self-signed HTTPS.
# Initialize data/tls once with deploy/init-tls.sh before compose up.
#
# NAS bind mounts that cannot chown to 10001: use the isolated root profile:
#   docker compose --profile nas-root up -d lezi-sync-nas-root
# Do not run both services against the same data directory.

x-lezi-sync-common: &lezi-sync-common
  image: ${LEZI_SYNC_IMAGE:-lezi-sync:0.3.6}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      LEZI_SYNC_VERSION: ${LEZI_SYNC_VERSION:-0.3.6}
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  environment: &lezi-sync-env
    LEZI_DATA_DIR: /data
    LEZI_HOST: "0.0.0.0"
    LEZI_PORT: "8765"
    LEZI_INTERNAL_PORT: "8766"
    LEZI_LAN_APK_DOWNLOAD_ORIGIN: "${LEZI_LAN_APK_DOWNLOAD_ORIGIN:-http://127.0.0.1:8767}"
    LEZI_TLS_CERTFILE: /data/tls/server.crt
    LEZI_TLS_KEYFILE: /data/tls/server.key
    LEZI_MAX_MEDIA_BYTES: ${LEZI_MAX_MEDIA_BYTES:-10485760}
    LEZI_CREATE_RATE_LIMIT: "${LEZI_CREATE_RATE_LIMIT:-20}"
    LEZI_MEMBER_REQUEST_RATE_LIMIT: "${LEZI_MEMBER_REQUEST_RATE_LIMIT:-10}"
    LEZI_MEMBER_REQUEST_TTL_HOURS: "${LEZI_MEMBER_REQUEST_TTL_HOURS:-24}"
    LEZI_MAX_PENDING_MEMBER_REQUESTS: "${LEZI_MAX_PENDING_MEMBER_REQUESTS:-32}"
    LEZI_RATE_LIMIT_WINDOW_SECONDS: "${LEZI_RATE_LIMIT_WINDOW_SECONDS:-60}"
    # Default remains fail-closed. Set 1 only on a NAS filesystem that permits
    # real persistence I/O but rejects chmod with EPERM/EACCES/EOPNOTSUPP.
    LEZI_ALLOW_PERMISSION_HARDENING_SKIP: "${LEZI_ALLOW_PERMISSION_HARDENING_SKIP:-0}"
    # Compose is the production deployment path and fails closed when unset.
    # Local `cargo run` may still omit the variable for development.
    LEZI_BOOTSTRAP_SECRET: ${LEZI_BOOTSTRAP_SECRET:?set LEZI_BOOTSTRAP_SECRET to a random value of at least 16 characters}
  volumes:
    - ${LEZI_DATA_HOST_PATH:-./data}:/data
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "lezi-sync", "healthcheck"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  lezi-sync:
    <<: *lezi-sync-common
    user: "10001:10001"
    # Host-side bind defaults to loopback. Override, e.g.:
    #   LEZI_SYNC_PUBLISH=0.0.0.0:8765  (or a LAN IP) for direct phone access.
    ports:
      - "${LEZI_SYNC_PUBLISH:-127.0.0.1:8765}:8765"
      - "${LEZI_LAN_APK_DOWNLOAD_PUBLISH:-127.0.0.1:8767}:8767"
    cap_drop:
      - ALL

  # Optional root profile for NAS volumes that refuse non-root ownership.
  # Explicitly opt-in; not the default security baseline.
  lezi-sync-nas-root:
    <<: *lezi-sync-common
    profiles: ["nas-root"]
    user: "0:0"
    ports:
      - "${LEZI_SYNC_PUBLISH:-127.0.0.1:8765}:8765"
      - "${LEZI_LAN_APK_DOWNLOAD_PUBLISH:-127.0.0.1:8767}:8767"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
