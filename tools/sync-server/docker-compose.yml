# Lezi sync server on NAS / dev machine.
# Usage:
#   ./build-image.sh
#   docker compose up -d
# Health: curl http://127.0.0.1:8765/health
#
# Single data root (db + media):
#   ./data/lezi.db
#   ./data/media/

services:
  lezi-sync:
    image: ${LEZI_SYNC_IMAGE:-lezi-sync:0.1.0-dev}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lezi-sync
    ports:
      - "${LEZI_SYNC_PORT:-8765}:8765"
    environment:
      LEZI_DATA_DIR: /data
      LEZI_SYNC_HOST: "0.0.0.0"
      LEZI_SYNC_PORT: "8765"
      LEZI_SYNC_VERSION: ${LEZI_SYNC_VERSION:-0.1.0-dev}
    volumes:
      # One volume path: SQLite + media/ live together
      - ${LEZI_DATA_HOST_PATH:-./data}:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
