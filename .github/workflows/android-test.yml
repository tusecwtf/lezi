name: Android unit tests

on:
  push:
    branches: [master]
    paths-ignore:
      - "tools/lezi-sync/**"
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "tools/lezi-sync/**"
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace --no-daemon
