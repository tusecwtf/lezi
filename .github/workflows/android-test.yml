name: Android and cross-platform proof

on:
  push:
    branches: [master]
    paths-ignore:
      - ".scratch/**"
      - "design/**"
      - "prototype/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - ".scratch/**"
      - "design/**"
      - "prototype/**"
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant gradlew
        run: chmod +x gradlew

      # Public debug/release JVM proof compiles release code without signing.
      # Normal assembleRelease still requires its signing and signature checks.
      - name: Unit tests
        run: ./gradlew test -PleziFastUnitTests=true -x :app:validateReleaseSigning --stacktrace --no-daemon

      - name: Public debug and lint gates
        run: ./gradlew :app:assembleDebug lintDebug --stacktrace --no-daemon

      # Compile/shrink release code without making or signing a distributable APK.
      - name: Public release R8 gate (no signing secrets)
        run: ./gradlew :app:minifyReleaseWithR8 -x :app:validateReleaseSigning --stacktrace --no-daemon

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
      - name: Required integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl curl sqlite3
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Current-checkout Rust x Android seam (no skips)
        run: bash tools/testing/run-isolated-integration.sh
