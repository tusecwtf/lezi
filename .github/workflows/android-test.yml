name: Android unit tests

on:
  push:
    branches: [master]
    paths-ignore:
      - "tools/lezi-sync/**"
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "tools/lezi-sync/**"
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build isolated sync test service
        run: |
          openssl version
          curl --version
          sqlite3 --version
          cargo build --manifest-path "$GITHUB_WORKSPACE/tools/lezi-sync/Cargo.toml" \
            --locked --bin lezi-sync --target-dir "$GITHUB_WORKSPACE/tools/lezi-sync/target"
          test -f "$GITHUB_WORKSPACE/tools/lezi-sync/target/debug/lezi-sync"
          test -x "$GITHUB_WORKSPACE/tools/lezi-sync/target/debug/lezi-sync"

      - name: Unit tests
        env:
          LEZI_SYNC_BIN: ${{ github.workspace }}/tools/lezi-sync/target/debug/lezi-sync
        run: ./gradlew test --stacktrace --info --no-daemon
