name: Android unit tests

on:
  push:
    branches: [master]
    paths-ignore:
      - "tools/lezi-sync/**"
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "tools/lezi-sync/**"
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build isolated sync test service
        run: |
          openssl version
          curl --version
          sqlite3 --version
          cargo build --manifest-path "$GITHUB_WORKSPACE/tools/lezi-sync/Cargo.toml" \
            --locked --bin lezi-sync --target-dir "$GITHUB_WORKSPACE/tools/lezi-sync/target"
          test -f "$GITHUB_WORKSPACE/tools/lezi-sync/target/debug/lezi-sync"
          test -x "$GITHUB_WORKSPACE/tools/lezi-sync/target/debug/lezi-sync"

      - name: Search SQL regression checks
        run: python3 domain/src/test/python/search_sql_contract_test.py

      - name: Unit tests and all debug test APK compilation
        id: unit_tests
        shell: bash
        env:
          LEZI_SYNC_BIN: ${{ github.workspace }}/tools/lezi-sync/target/debug/lezi-sync
          LEZI_SYNC_PERF_SAMPLE: "1"
        run: |
          set -o pipefail
          export LEZI_SYNC_SOURCE_SHA="$(git rev-parse HEAD)"
          ./gradlew test :app:assembleDebug assembleDebugAndroidTest --stacktrace --info --no-daemon 2>&1 | tee "$RUNNER_TEMP/android-unit-tests.log"

      - name: Summarize unit test diagnostics
        if: always()
        env:
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          import re

          log = Path(os.environ["RUNNER_TEMP"]) / "android-unit-tests.log"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## Android unit test diagnostics\n\n")
              summary.write(f"Unit tests: {os.environ['UNIT_TEST_OUTCOME']}.\n\n")
              summary.write("The upload step below collects the full Gradle log and any generated JUnit XML/HTML reports as android-unit-test-diagnostics (3-day retention).\n\n")
              if not log.is_file():
                  summary.write("No Gradle log was created; the unit test step may not have started.\n")
              else:
                  lines = log.read_text(errors="replace").splitlines()
                  failure = re.compile(r"(^FAILURE:|\bFAILED\b|^e: |^error: |Execution failed for task|Caused by:)")
                  hits = [i for i, line in enumerate(lines) if failure.search(line)][:20]
                  selected = set()
                  for i in hits:
                      selected.update(range(max(0, i - 3), min(len(lines), i + 9)))
                  if not selected:
                      selected.update(range(max(0, len(lines) - 60), len(lines)))
                  excerpt = "\n".join(f"{i + 1}: {lines[i]}" for i in sorted(selected))
                  excerpt = html.escape(excerpt).encode("utf-8")[:24000].decode("utf-8", errors="ignore")
                  summary.write("Excerpt: first 20 failure markers with context, or the last 60 lines if none match; capped at 24,000 bytes.\n\n")
                  summary.write(f"<pre>{excerpt}</pre>\n")
          PY

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-unit-test-diagnostics
          path: |
            ${{ runner.temp }}/android-unit-tests.log
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 3
