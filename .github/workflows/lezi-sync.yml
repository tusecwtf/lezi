name: lezi-sync

on:
  push:
    branches: [master]
    paths:
      - "tools/lezi-sync/**"
      - ".github/workflows/lezi-sync.yml"
      - "config/**"
      # Metadata validation logic is itself a release-contract input.
      - "app/build.gradle.kts"
      # Android codecs/closed key sets are wire inputs even without doc edits.
      - "sync/src/main/**"
      - "core/model/src/main/**"
      - "core/database/**"
      - "docs/spec/contracts/**"
      - "tools/testing/**"
  pull_request:
    branches: [master]
    paths:
      - "tools/lezi-sync/**"
      - ".github/workflows/lezi-sync.yml"
      - "config/**"
      # Metadata validation logic is itself a release-contract input.
      - "app/build.gradle.kts"
      # Android codecs/closed key sets are wire inputs even without doc edits.
      - "sync/src/main/**"
      - "core/model/src/main/**"
      - "core/database/**"
      - "docs/spec/contracts/**"
      - "tools/testing/**"
  workflow_dispatch:

concurrency:
  group: lezi-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tools/lezi-sync

env:
  LEZI_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        run: |
          test "$(git rev-parse HEAD)" = "$LEZI_EXPECTED_REVISION"
          mkdir -p ../../build/ci-evidence
          git rev-parse HEAD HEAD^{tree} > ../../build/ci-evidence/rust-source-identity.txt

      - name: Required fixture tools and workflow contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl curl sqlite3 ripgrep python3-yaml
          python3 ../testing/test_workflow_contracts.py

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/lezi-sync -> target

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee ../../build/ci-evidence/rust-tests.log

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Isolated deployment smoke: tool fixtures never contact the NAS or save real images.
      # Invoke via bash so a non-executable commit mode still runs on Actions.
      - name: Explicit operator configuration (offline fixtures)
        run: bash deploy/test-explicit-operator-config.sh

      - name: docker cargo build-context helper
        run: |
          bash docker/test-prepare-build-context.sh
          bash docker/test-version-contract.sh

      - name: package-nas app-update inputs
        run: bash deploy/test-package-nas-app-update.sh

      - name: NAS release and rollback identity
        run: bash deploy/test-nas-release-identity.sh

      - name: remote-deploy app-update atomic pair
        run: bash deploy/test-remote-deploy-app-update-atomic.sh

      - name: TLS inspect-only read-only contract
        run: |
          bash deploy/test-init-tls-read-only.sh
          bash deploy/test-remote-deploy-tls-inspection-read-only.sh

      - name: TLS identity preservation
        run: |
          bash deploy/test-init-tls.sh
          bash deploy/test-remote-deploy-tls-guard.sh

      - name: Remaining isolated release fixtures
        run: |
          bash deploy/test-copy-back-nas-data.sh
          bash deploy/test-image-config-digest.sh
          bash deploy/test-live-cutover-probe.sh
          bash deploy/test-push-and-deploy-tls-bootstrap.sh
          bash deploy/test-schema-cutover.sh
          bash deploy/test-schema-update-pair.sh
          bash deploy/test-schema-cutover-rehearsal.sh
          bash ../testing/test-isolated-integration.sh

      - name: Rust source identity and test evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-gates-${{ env.LEZI_EXPECTED_REVISION }}
          path: build/ci-evidence/
