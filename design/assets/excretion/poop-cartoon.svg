<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="便便">
  <defs>
    <linearGradient id="poopBody" x1="28" y1="18" x2="72" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8C078"/>
      <stop offset="55%" stop-color="#C9974A"/>
      <stop offset="100%" stop-color="#A87832"/>
    </linearGradient>
    <linearGradient id="poopShine" x1="34" y1="28" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFF3D6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#8B6A2E" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- 圆形暖底：选择器/快捷入口常见圆形热区 -->
  <circle cx="48" cy="48" r="44" fill="#F8F0D4"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#E8D9B0" stroke-width="1"/>

  <!-- 三层软堆叠轮廓（自绘，非参考产品美术） -->
  <g filter="url(#soft)">
    <path fill="url(#poopBody)" d="
      M48 22
      c6.2 0 10.4 3.8 11.2 9.2
      5.4.6 9.2 4.4 9.6 9.8
      6.2 1.2 9.8 5.8 9.2 12.4
      C76.8 65.2 68.4 72 54.6 72
      H41.4
      C27.6 72 19.2 65.2 18 53.4
      c-.6-6.6 2.8-11.2 9-12.6
      .6-5.2 4.2-9 9.4-9.8
      C37.4 25.4 42 22 48 22Z"/>
    <path fill="url(#poopShine)" d="
      M38 34
      c4-6 12-8 18-5
      1.6 4.2-.2 8.2-4.4 10.4
      -5.2 1-10.2-1.2-13.6-5.4Z"/>
  </g>

  <!-- 安静小表情 -->
  <circle cx="40.5" cy="52" r="2.1" fill="#4A3420"/>
  <circle cx="55.5" cy="52" r="2.1" fill="#4A3420"/>
  <circle cx="41.2" cy="51.3" r="0.7" fill="#FFF6E4" opacity=".85"/>
  <circle cx="56.2" cy="51.3" r="0.7" fill="#FFF6E4" opacity=".85"/>
  <path d="M44.5 57.2c1.6 2.1 5.4 2.1 7 0" fill="none" stroke="#4A3420" stroke-width="1.8" stroke-linecap="round"/>
</svg>
